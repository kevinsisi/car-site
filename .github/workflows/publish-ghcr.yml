name: Publish GHCR Image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/kevinsisi/car-site

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish digest
        id: digest
        run: |
          echo "Image: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy-l390:
    runs-on: [self-hosted, l390]
    needs: publish
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout runtime repository
        uses: actions/checkout@v6
        with:
          repository: chuangkevin/l390-homelab-runtime
          ref: main
          ssh-key: ${{ secrets.L390_RUNTIME_REPO_DEPLOY_KEY }}

      - name: Log in and pull published image
        env:
          GHCR_TOKEN: ${{ github.token }}
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ needs.publish.outputs.digest }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$IMAGE_REF"
          docker logout ghcr.io

      - name: Promote runtime image
        env:
          RUNTIME_IMAGE_REFS_FILE: /srv/l390-homelab/runtime-image-refs.env
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ needs.publish.outputs.digest }}
        run: sudo bash scripts/promote-runtime.sh promote car-site-mita "$IMAGE_REF"
