name = "mita-cloudflare-preview"
main = "dist/_worker.js/index.js"
compatibility_date = "2026-09-30"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

[env.preview]
name = "mita-cloudflare-preview-isolated"
workers_dev = true

[env.preview.vars]
MITA_ENV = "preview"

[env.preview.assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

[[env.preview.d1_databases]]
binding = "DB_PREVIEW"
database_name = "mita-preview"
database_id = ""
migrations_dir = "migrations/d1"

[[env.preview.r2_buckets]]
binding = "MEDIA_PREVIEW"
bucket_name = "mita-preview"
